<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Console — LF Property Media</title>

<link rel="icon" href="/images/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --lf-paper:#faf8f5; --lf-white:#fff; --lf-cream:#f3ede2;
    --lf-ink:#1a1a1a; --lf-muted:#6b6b6b;
    --lf-sand:#b08968; --lf-sand-dark:#8c6a4e; --lf-sand-light:#d4b896;
    --lf-sand-soft:#ede2d1; --lf-border:#e8e2d5;
    --font-display:"Playfair Display",Georgia,serif;
    --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --lift-1:0 1px 2px rgba(38,26,16,.10), 0 2px 8px rgba(38,26,16,.06);
    --lift-2:0 2px 4px rgba(38,26,16,.10), 0 8px 24px rgba(38,26,16,.10);
    --ease-out:cubic-bezier(.22,.68,.36,1);
    --ease-spring:cubic-bezier(.34,1.42,.48,1);
    --s1:.375rem; --s2:.625rem; --s3:1rem; --s4:1.5rem; --s5:2.25rem; --s6:3.5rem;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{min-height:100%;}
  body{
    margin:0; font-family:var(--font-body); color:var(--lf-ink); background:var(--lf-paper);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }

  /* ------------------------------------------------------------- topbar */
  .top{
    display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
    padding:var(--s3) var(--s4); background:var(--lf-white);
    border-bottom:1px solid var(--lf-border);
  }
  .mark{font-family:var(--font-display); font-size:1.375rem; line-height:1;
        letter-spacing:-.02em; color:var(--lf-ink); text-decoration:none;}
  .mark i{color:var(--lf-sand); font-style:italic;}
  .rule{width:1px; height:26px; background:var(--lf-border);}
  .who{display:flex; flex-direction:column; gap:.15em; min-width:0;}
  .who b{font-weight:500; font-size:.875rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .who span{font-size:.6875rem; letter-spacing:.1em; text-transform:uppercase; color:var(--lf-muted);}
  .spacer{margin-left:auto;}
  .badge{
    font-size:.625rem; letter-spacing:.12em; text-transform:uppercase; font-weight:600;
    padding:.25rem .5rem; border-radius:2px; background:var(--lf-sand-soft); color:var(--lf-sand-dark);
  }
  button,.btn{
    font:inherit; font-size:.75rem; letter-spacing:.06em; padding:.5rem .875rem;
    border-radius:3px; border:1px solid var(--lf-border); background:var(--lf-white);
    color:var(--lf-ink); cursor:pointer; text-decoration:none; display:inline-block;
    transition:border-color .18s var(--ease-out), background-color .18s var(--ease-out),
               transform .18s var(--ease-spring);
  }
  button:hover,.btn:hover{border-color:var(--lf-sand); background:var(--lf-cream);}
  button:focus-visible,.btn:focus-visible{outline:2px solid var(--lf-sand); outline-offset:2px;}
  button:active,.btn:active{transform:translateY(1px) scale(.99);}

  /* --------------------------------------------------------------- page */
  main{max-width:1080px; margin:0 auto; padding:var(--s5) var(--s4) var(--s6);}
  h1{font-family:var(--font-display); font-weight:400; font-size:2rem;
     letter-spacing:-.025em; margin:0 0 .25rem;}
  h1 i{color:var(--lf-sand); font-style:italic;}
  .lede{margin:0; color:var(--lf-muted); font-size:.9375rem; line-height:1.65;}
  .head{display:flex; align-items:flex-start; gap:var(--s3); flex-wrap:wrap; margin-bottom:var(--s5);}
  .head > div{flex:1; min-width:16rem;}
  .btn--go{background:var(--lf-ink); border-color:var(--lf-ink); color:var(--lf-paper); font-weight:600;
           letter-spacing:.1em; text-transform:uppercase; padding:.7rem 1.1rem;}
  .btn--go:hover{background:var(--lf-sand-dark); border-color:var(--lf-sand-dark); color:var(--lf-paper);}
  .sec{font-size:.6875rem; letter-spacing:.15em; text-transform:uppercase; color:var(--lf-muted);
       font-weight:600; margin:var(--s5) 0 var(--s3);}
  .sec:first-of-type{margin-top:0;}
  .status[data-s="draft"],.status[data-s="queued"]{background:var(--lf-sand-soft); color:var(--lf-sand-dark);}
  .status[data-s="processing"]{background:#e6eef5; color:#2f5a7d;}
  .status[data-s="ready"]{background:#e7f0e4; color:#3d6b33;}
  .status[data-s="failed"]{background:#fdf0ec; color:#8a3520;}

  .grid{display:grid; gap:var(--s3); grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
  .card{
    background:var(--lf-white); border:1px solid var(--lf-border); border-radius:4px;
    padding:var(--s3); box-shadow:var(--lift-1); display:flex; flex-direction:column; gap:var(--s2);
    transition:box-shadow .22s var(--ease-out), transform .22s var(--ease-spring);
  }
  .card:hover{box-shadow:var(--lift-2); transform:translateY(-2px);}
  .card h3{margin:0; font-family:var(--font-display); font-weight:400; font-size:1.125rem; letter-spacing:-.01em;}
  .card .meta{font-size:.75rem; color:var(--lf-muted);}
  .card .facts{display:flex; gap:var(--s2); font-size:.75rem; color:var(--lf-muted); flex-wrap:wrap;}
  .status{
    font-size:.625rem; letter-spacing:.12em; text-transform:uppercase; font-weight:600;
    padding:.2rem .45rem; border-radius:2px; align-self:flex-start;
  }
  .status[data-s="published"]{background:#e7f0e4; color:#3d6b33;}
  .status[data-s="draft"]{background:var(--lf-sand-soft); color:var(--lf-sand-dark);}
  .status[data-s="archived"]{background:#eee; color:#666;}

  .empty{
    border:1.5px dashed var(--lf-border); border-radius:4px; padding:var(--s6) var(--s4);
    text-align:center; background:var(--lf-white);
  }
  .empty h2{font-family:var(--font-display); font-weight:400; font-size:1.25rem; margin:0 0 var(--s2);}
  .empty p{margin:0 auto; max-width:44ch; font-size:.875rem; line-height:1.7; color:var(--lf-muted);}
  .err{padding:var(--s3); border-radius:3px; background:#fdf0ec; border:1px solid #e3b4a6;
       color:#8a3520; font-size:.875rem;}
  .err[hidden]{display:none;}
  .skeleton{height:118px; border-radius:4px; background:linear-gradient(90deg,#f0ebe3,#f7f3ed,#f0ebe3);
            background-size:200% 100%; animation:shimmer 1.4s linear infinite;}
  @keyframes shimmer{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>

<header class="top">
  <a class="mark" href="/">LF<i>.</i></a>
  <div class="rule"></div>
  <div class="who">
    <b id="who">—</b>
    <span id="tenant">—</span>
  </div>
  <span class="badge" id="role" hidden></span>
  <div class="spacer"></div>
  <button id="signout" type="button">Sign out</button>
</header>

<main>
  <div class="head">
    <div>
      <h1>Your <i>listings</i></h1>
      <p class="lede">Every property you've had shot, and the virtual tour attached to it.</p>
    </div>
    <a class="btn btn--go" href="/app/upload/">Send us a shoot</a>
  </div>

  <p class="err" id="err" hidden role="alert"></p>

  <section id="jobsSection" hidden>
    <h2 class="sec">In progress</h2>
    <div class="grid" id="jobs"></div>
  </section>

  <h2 class="sec" id="toursHead" hidden>Published</h2>
  <div class="grid" id="grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* The middleware already redirects an unauthenticated visitor, so reaching this
   script means there is a session. It is still fetched rather than templated in:
   the session can expire while the tab sits open, and a 401 here is the signal
   to send them back rather than render a shell full of nothing. */
async function api(path) {
  const res = await fetch(path, { headers: { accept: 'application/json' } });
  if (res.status === 401) {
    location.assign(`/app/login/?next=${encodeURIComponent(location.pathname)}`);
    throw new Error('unauthenticated');
  }
  if (!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
  return res.json();
}

$('signout').addEventListener('click', async () => {
  try { await fetch('/api/auth/logout', { method: 'POST' }); } finally {
    location.assign('/app/login/');
  }
});

const fmt = (n) => Number(n).toLocaleString();

const WORDING = {
  draft: 'Not sent yet', queued: 'Waiting to be processed',
  processing: 'Being processed', ready: 'Ready to review',
  published: 'Live', failed: 'Something went wrong',
};

function renderJobs(jobs) {
  // A published job is represented by its tour below; showing it twice would
  // make one property look like two.
  const open = jobs.filter((j) => j.status !== 'published');
  if (!open.length) return;
  $('jobsSection').hidden = false;
  $('jobs').innerHTML = open.map((j) => `
    <article class="card">
      <span class="status" data-s="${esc(j.status)}">${esc(WORDING[j.status] ?? j.status)}</span>
      <h3>${esc(j.address || 'Untitled shoot')}</h3>
      <div class="facts">
        <span>${esc(j.raw_files)} file${j.raw_files === 1 ? '' : 's'}</span>
        ${j.raw_bytes ? `<span>${Math.round(j.raw_bytes / 1e9 * 10) / 10} GB</span>` : ''}
      </div>
      ${j.status === 'failed' && j.error ? `<div class="meta">${esc(j.error)}</div>` : ''}
      ${j.status === 'draft' ? '<a class="btn" href="/app/upload/">Finish sending</a>' : ''}
    </article>`).join('');
}

function renderTours(tours) {
  if (!tours.length) {
    $('grid').outerHTML = `
      <div class="empty">
        <h2>No published tours yet</h2>
        <p>Send us a shoot and the finished tour lands here, ready to check over
           before the link goes on the listing.</p>
      </div>`;
    return;
  }
  $('toursHead').hidden = false;
  $('grid').innerHTML = tours.map((t) => `
    <article class="card">
      <span class="status" data-s="${esc(t.status)}">${esc(t.status)}</span>
      <h3>${esc(t.address)}</h3>
      <div class="meta">${esc([t.city, t.state].filter(Boolean).join(', '))}</div>
      <div class="facts">
        ${t.beds ? `<span>${esc(t.beds)} bd</span>` : ''}
        ${t.baths ? `<span>${esc(t.baths)} ba</span>` : ''}
        ${t.sqft ? `<span>${fmt(t.sqft)} sq ft</span>` : ''}
        <span>${esc(t.scenes)} room${t.scenes === 1 ? '' : 's'}</span>
      </div>
      <a class="btn" href="/t/${esc(t.slug)}/">Open tour</a>
    </article>`).join('');
}

try {
  const { user } = await api('/api/auth/me');
  $('who').textContent = user.name || user.email;
  $('tenant').textContent = user.tenant_name || '';
  if (user.role === 'owner') { $('role').hidden = false; $('role').textContent = 'Owner'; }

  // Both at once: a slow tours query should not hold up the in-progress list,
  // which is the part someone reloads this page to watch.
  const [jobs, tours] = await Promise.all([api('/api/jobs'), api('/api/tours')]);
  renderJobs(jobs.jobs);
  renderTours(tours.tours);
} catch (e) {
  if (e.message !== 'unauthenticated') {
    $('grid').innerHTML = '';
    $('err').hidden = false;
    $('err').textContent = `Could not load your listings: ${e.message}`;
  }
}
</script>
</body>
</html>
